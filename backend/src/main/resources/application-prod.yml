spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000} # 15 minutes default
  refresh-token-expiration: 604800000 # 7 days
  secure-cookie: true # Ensure cookies are marked as secure in production

cors:
  allowed-origins: ${FRONTEND_URL}

logging:
  level:
    root: INFO
    com.fakecompanydetector: INFO
    org.springframework.security: WARN
