spring:
  application:
    name: fake-company-detector
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fcd_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

logging:
  level:
    com.fakecompanydetector: DEBUG
