version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fcd_postgres
    environment:
      POSTGRES_DB: fcd_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fcd_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: fcd_backend
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.example

  frontend:
    build:
      context: ./frontend
    container_name: fcd_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env.example
    command: npm run dev -- --host

volumes:
  pg_data:
